# Build the gallery and publish it to GitHub Pages on every push to main.
#
# Forks need ONE manual step: Settings → Pages → Source → "GitHub Actions".
# actions/configure-pages injects the right SITE_URL/BASE_PATH automatically,
# so this works unchanged for user pages (<user>.github.io), project pages
# (<user>.github.io/<repo>/), and custom domains.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      # The suite is pure functions (slugs, ordering, captions); running it in
      # two far-apart zones is what keeps date rendering timezone-independent.
      - name: Test
        run: |
          npm test
          TZ=Pacific/Kiritimati npm test
          TZ=Pacific/Midway npm test

      # Astro keeps generated renditions here; reusing them across runs means a
      # push that adds one photo does not re-encode the whole gallery.
      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-assets-${{ hashFiles('src/content/photos/**') }}
          restore-keys: astro-assets-

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
